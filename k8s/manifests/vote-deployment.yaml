apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting-app
  labels:
    app: vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: hiiamgay/vote:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: OPTION_A
          value: "Cats"
        - name: OPTION_B
          value: "Dogs"
        - name: REDIS_HOST
          value: "redis"
        - name: DB_HOST
          value: "db"
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"  # Cổng container đang chạy ứng dụng
    prometheus.io/path: "/metrics"
  labels:
    app: vote
spec:
  selector:
    app: vote
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
