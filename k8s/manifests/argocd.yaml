apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-voting-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/dotientri/Example-Voting-App.git"
    path: "k8s/manifests"
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
